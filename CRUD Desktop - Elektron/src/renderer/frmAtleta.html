<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Atleta</title>
    <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <h4 class="mb-3 text-primary">Cadastrar Atleta</h4>

    <form id="formAtleta">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" name="nome" class="form-control" maxlength="100" required>
        </div>

        <div class="mb-3">
            <label for="posicao" class="form-label">Posição</label>
            <input type="text" id="posicao" name="posicao" class="form-control" maxlength="100" placeholder="Ex: Atacante" required>
        </div>

        <div class="mb-3">
            <label for="pe_dominante" class="form-label">Pé Dominante</label>
            <select id="pe_dominante" name="pe_dominante" class="form-select" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="Direito">Direito</option>
                <option value="Esquerdo">Esquerdo</option>
                <option value="Ambidestro">Ambidestro</option>
            </select>
        </div>

        <div class="mb-4">
            <label for="ano_nascimento" class="form-label">Ano de Nascimento</label>
            <input type="number" id="ano_nascimento" name="ano_nascimento" class="form-control" min="1950" max="2100" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold">Salvar</button>
    </form>

    <script src="js/frmAtleta.js"></script>
</body>
</html>
