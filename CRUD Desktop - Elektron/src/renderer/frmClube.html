<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Clube</title>
    <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <h4 class="mb-3 text-primary">Cadastrar Clube</h4>

    <form id="formClube">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" name="nome" class="form-control" maxlength="100" required>
        </div>

        <div class="mb-3">
            <label for="cidade" class="form-label">Cidade</label>
            <input type="text" id="cidade" name="cidade" class="form-control" maxlength="100" placeholder="Ex: Rio de Janeiro" required>
        </div>

        <div class="mb-4">
            <label for="ano_fundacao" class="form-label">Ano de Fundação</label>
            <input type="number" id="ano_fundacao" name="ano_fundacao" class="form-control" min="1800" max="2100" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold">Salvar</button>
    </form>

    <script src="js/frmClube.js"></script>
</body>
</html>
